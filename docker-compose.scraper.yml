# REPXPERT scraper — AYRI compose projesi, bilerek.
#
# Ana projeye konsaydı her deploy onu da öldürürdü: `scripts/vps-deploy.sh`
# önce `docker compose down --remove-orphans` çalıştırıyor ve bu, profile'a
# alınmış servisleri de kapsar. Süpürme günler sürdüğü için araya giren bir
# deploy'un koşuyu düşürmesi kabul edilemez — kendi projesinde durur, deploy
# ona dokunmaz.
#
# Ağ: ana projenin ağına KONUK OLMUYOR, host ağını kullanıyor.
#
# Konuk olmayı denedik ve yetmedi: deploy'un `docker compose down` adımı ana
# projenin ağını da siliyor, ağ yeniden kurulduğunda yeni bir kimlikle geliyor
# ve süpürme kabı ağsız kalıyor — yani ayrı projede durmak tek başına
# korumuyordu. Host ağında böyle bir bağ yok.
#
# postgres adı `extra_hosts` ile 127.0.0.1'e bağlanıyor: prod postgres zaten
# loopback'e yayımlı (127.0.0.1:5432). Böylece .env.production'daki
# `postgres:5432` adresi olduğu gibi çalışır, ikinci bir bağlantı dizesi
# tanımlamaya ve parolayı bir yere daha yazmaya gerek kalmaz.
#
# Kullanım (VPS'te /opt/getirbakim içinden):
#   docker compose -f docker-compose.scraper.yml --env-file .env.production build
#   docker compose -f docker-compose.scraper.yml --env-file .env.production up -d
#   docker compose -f docker-compose.scraper.yml logs -f
#   docker compose -f docker-compose.scraper.yml down
#
# Ön koşul: `.data/repxpert/profile` altında GİRİŞ YAPILMIŞ bir tarayıcı
# profili bulunmalı (servis anonim oturuma TecDoc'u kapatıyor).

name: getirbakim-scraper

services:
  repxpert:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: getirbakim-repxpert-scraper
    # Süpürme bitince 0 ile çıkar ve yeniden başlatılmaz; yalnız çökerse döner.
    #
    # Deneme sayısı SINIRSIZ, bilerek: koşu günlerce sürüyor ve bu sürede
    # veritabanı en az bir kez yeniden kuruluyor (her deploy postgres'i
    # değiştiriyor). Prisma o anda ECONNREFUSED ile ölüyor ve tek çare yeniden
    # başlamak. Üç denemelik sınır, art arda iki deploy'da tükenip süpürmeyi
    # sessizce bitiriyordu.
    restart: on-failure
    env_file: .env.production
    environment:
      NODE_ENV: production
      # Playwright imajı tarayıcıları root'un altına kuruyor.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    # Chromium paylaşımlı bellek ister; varsayılan 64 MB'de sekme çöker.
    shm_size: 1gb
    volumes:
      # Oturum profili + checkpoint burada yaşar: kap yeniden kurulsa da
      # koşu kaldığı yerden devam etsin.
      - ./.data:/app/.data
    network_mode: host
    extra_hosts:
      - 'postgres:127.0.0.1'
    command:
      - bun
      - scripts/repxpert-sweep.ts
