# ─────────────────────────────────────────────────────────────────────────────
# Neutral edge reverse proxy
#
# This is a standalone infrastructure unit, owned by NEITHER product. It runs the
# single nginx that binds ports 80/443 for the whole VPS and terminates TLS, then
# proxies to each independent app over the shared external `edge` Docker network.
#
#   Cloudflare ──▶ edge-nginx (this, 80/443) ──▶ getirbakim-app:3000  (getirbakim)
#                                            └──▶ bakimx-app:3000       (bakimx prod)
#                                            └──▶ bakimx-staging-app:3000 (bakimx staging)
#
# Each app project (getirbakim, bakimx) declares `edge` as an EXTERNAL network and
# attaches its app container with a stable alias (getirbakim-app / bakimx-app /
# bakimx-staging-app). Neither app repo runs nginx or references the other.
#
# The `edge` network is created once, out of band (see deploy.sh):
#   docker network create edge
#
# Certificates live on the host (/etc/letsencrypt, managed by host certbot) and
# are mounted read-only. After renewal, certbot's deploy-hook must reload THIS
# container:  docker exec edge-nginx nginx -s reload   (see README.md).
# ─────────────────────────────────────────────────────────────────────────────

services:
  nginx:
    image: nginx:stable-alpine
    container_name: edge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # getirbakim.conf mounts as default.conf so it replaces the stock image
      # default and carries the edge-wide http globals (resolver, rate zones).
      # It declares default_server, so include order does not decide the default.
      - ./conf.d/getirbakim.conf:/etc/nginx/conf.d/default.conf:ro
      - ./conf.d/bakimx.conf:/etc/nginx/conf.d/10-bakimx.conf:ro
      # Host-managed Let's Encrypt certs + ACME webroot (read-only).
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

networks:
  # Shared, neutral network. Created out of band and referenced as external by
  # this unit AND by every app project. Owned by no single compose project so a
  # `docker compose down` in any app never destroys it.
  edge:
    external: true
    name: edge
