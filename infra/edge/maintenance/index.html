<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Getirbakim · Kısa bir bakımdayız</title>
<style>
  :root { --bg: #f6f7f9; --card: #ffffff; --text: #16191d; --muted: #5b636d; --line: #e3e6ea; --accent: #e8590c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111315; --card: #1a1d20; --text: #eef0f2; --muted: #a3abb4; --line: #2a2e33; --accent: #ff8a3d; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: grid; place-items: center; padding: 24px 16px;
  }
  main {
    width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 32px 28px; text-align: center;
  }
  .brand { font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
  .brand span { color: var(--accent); }
  .icon { width: 56px; height: 56px; margin: 24px auto 8px; color: var(--accent); }
  h1 { font-size: 22px; line-height: 1.3; margin: 8px 0 12px; }
  p { margin: 0 0 12px; color: var(--muted); }
  a { color: var(--accent); }
  .note { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="brand">Getir<span>bakim</span></div>
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
  </svg>
  <h1>Kısa bir bakımdayız</h1>
  <p>Sitemizi daha hızlı ve güvenilir bir altyapıya taşıyoruz. Bu sırada sipariş ve üyelik işlemleri geçici olarak kapalı.</p>
  <p>Birazdan yeniden buradayız. Sayfayı daha sonra yenileyebilirsiniz.</p>
  <p class="note">Acil bir sorunuz varsa: <a href="mailto:hey@getirbakim.com">hey@getirbakim.com</a></p>
</main>
</body>
</html>
