# Production Nginx Configuration — GetirBakim V2
#
# Architecture:
#   Cloudflare (Proxy + SSL + CDN + WAF + Rate Limit)
#        ↓
#   Nginx (this config — Docker container, ports 80/443 only)
#        ↓
#   Next.js app (Docker internal network, app:3000)
#   Meilisearch (Docker internal network, meilisearch:7700)
#
# Purpose:
#   This config runs INSIDE Docker Compose as the nginx service.
#   It is the ONLY container with public port exposure (80, 443).
#   All other services communicate via private Docker network only.
#
# Canonical domain: https://getirbakim.com (apex, no www)
# www.getirbakim.com 301 => https://getirbakim.com
# HTTP 301 => HTTPS (with Let's Encrypt ACME challenge passthrough)
#
# SSL certificates are mounted from host at /etc/letsencrypt (read-only).
# Certbot runs on the host (cron/systemd timer) independently.
#
# Design decisions:
# 1. gzip only — Cloudflare handles Brotli at the edge
# 2. HTTP/3 via Cloudflare — nginx official image lacks QUIC module
# 3. Rate limiting keyed by CF-Connecting-IP (falls back to remote_addr)
# 4. All security headers set here AND in Next.js middleware (defense in depth)
# 5. No server_tokens — hides nginx version
# 6. WebSocket support for Next.js HMR and real-time features
# 7. www → apex canonical redirect
# 8. Internal `/api/internal/*` routes blocked from public access
#
# Installation:
#   Mount this file to /etc/nginx/conf.d/default.conf in the nginx container.
#   See docker-compose.yml for volume mount configuration.
#
# Validation:
#   docker compose exec nginx nginx -t

# ─── Rate Limiting Zones ─────────────────────────────────────────────────────
# Key: CF-Connecting-IP (real client behind Cloudflare), fallback to direct IP.
# This ensures rate limits apply per REAL user, not per Cloudflare edge IP.

map $http_cf_connecting_ip $rate_limit_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

# Global API rate limit: 20 req/s per IP (burst 40)
limit_req_zone $rate_limit_key zone=api_global:10m rate=20r/s;

# Search-specific: 10 req/s per IP (burst 20) — higher SKU count, bots target this
limit_req_zone $rate_limit_key zone=api_search:10m rate=10r/s;

# Auth-specific: 3 req/s per IP (burst 5) — credential stuffing protection
limit_req_zone $rate_limit_key zone=auth:10m rate=3r/s;

# Admin-specific: 5 req/s per IP (burst 10)
limit_req_zone $rate_limit_key zone=admin:10m rate=5r/s;

# General request rate: 100 req/s per IP
limit_req_zone $rate_limit_key zone=general:10m rate=100r/s;

# Connection limit: 20 per IP
limit_conn_zone $rate_limit_key zone=conn_per_ip:10m;

# ─── DNS Resolver ─────────────────────────────────────────────────────────────
# Docker's embedded DNS at 127.0.0.11 resolves service names.
# The `valid=10s` tells nginx to periodically re-resolve hostnames,
# which is essential during container restarts and network recreation.
resolver 127.0.0.11 valid=10s;

# ─── Upstream Variables ───────────────────────────────────────────────────────
# Use variables + resolver for runtime DNS resolution (required because Alpine's
# musl DNS resolver does not reliably resolve Docker service names at startup).
map "" $app_upstream {
    default "getirbakim-app:3000";
}
map "" $bakimx_upstream {
    default "bakimx-app-1:3000";
}

# ─── HTTP → HTTPS Redirect ───────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name getirbakim.com www.getirbakim.com;

    server_tokens off;

    # Certbot ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://getirbakim.com$request_uri;
    }
}

# ─── HTTPS: www → apex Redirect ──────────────────────────────────────────────

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.getirbakim.com;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/getirbakim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getirbakim.com/privkey.pem;

    # Trusted certificate chain for OCSP stapling (if available)
    ssl_trusted_certificate /etc/letsencrypt/live/getirbakim.com/chain.pem;

    return 301 https://getirbakim.com$request_uri;
}

# ─── HTTPS: Primary Server (apex only) ───────────────────────────────────────

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name getirbakim.com;

    server_tokens off;

    # ── SSL/TLS ──────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/getirbakim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getirbakim.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/getirbakim.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    # Modern, secure cipher suite — prefers server order
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;

    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling — improves TLS handshake speed and privacy
    ssl_stapling on;
    ssl_stapling_verify on;

    # Cloudflare-compatible: 10-year HSTS for apex + subdomains
    # This tells browsers to always use HTTPS for this domain.
    # IMPORTANT: Only enable AFTER confirming HTTPS works reliably with CF.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Security Headers ──────────────────────────────────────────────────
    # Defense-in-depth: these are also set in Next.js middleware.
    # Setting them here protects static assets and catches any middleware bypass.

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;

    # Content-Security-Policy is set by Next.js middleware — not duplicated here
    # to avoid CSP header intersection issues.

    # Disable client-side MIME type overrides
    add_header X-Download-Options "noopen" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # ── Timeouts ──────────────────────────────────────────────────────────
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 90s;
    send_timeout 30s;

    # ── Upload Limit ─────────────────────────────────────────────────────
    client_max_body_size 10M;

    # ── Gzip Compression ──────────────────────────────────────────────────
    # Cloudflare handles Brotli at the edge; gzip here handles direct connections.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/wasm
        application/manifest+json
        image/svg+xml
        font/woff2
        font/woff
        font/ttf
        font/eot
        font/otf;

    # ── Connection Limits ─────────────────────────────────────────────────
    # Server-level moved to catch-all / location; static assets are exempt.
    # NOTE: limit_conn conn_per_ip 0 is INVALID in nginx 1.30+.
    limit_conn_status 429;

    # ══════════════════════════════════════════════════════════════════════
    # LOCATION BLOCKS — ordered by specificity (most specific first)
    # ══════════════════════════════════════════════════════════════════════

    # ── Block Internal API from public access ─────────────────────────────
    # /api/internal/* routes are for cron jobs and internal services only.
    # They require CRON_SECRET header. Block at nginx level for defense in depth.
    location /api/internal/ {
        deny all;
        return 403 '{"error":"Forbidden"}';
        add_header Content-Type application/json;
    }

    # ── Rate-Limited API Endpoints ────────────────────────────────────────

    # /api/search — high-value target for scrapers and bots
    location /api/search {
        limit_req zone=api_search burst=20 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 10;

        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # /api/auth/* — credential stuffing and brute-force protection
    # Also covers /auth/* paths for sign-in/sign-up callbacks
    location ~ ^/(api/auth|auth/callback|auth/v1) {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 5;

        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # /admin/* — admin panel rate limiting
    location /admin {
        limit_req zone=admin burst=10 nodelay;
        limit_req_status 429;

        # Preserve locale prefix: /admin AND /tr/admin, /en/admin
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Static Assets — immutable, long cache ─────────────────────────────
    # /_next/static/* contains hashed filenames — safe to cache forever.
    # Cloudflare will cache these at the edge.
    # NOTE: Exempt from connection limit (many JS chunks fetched in parallel).
    location /_next/static/ {
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # 1 year cache with immutable directive
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Do not let missing hashed assets fall through to the Next.js HTML
        # error page. Browsers must receive a real 404 for stale chunks;
        # otherwise they try to execute HTML as JavaScript after deploys.
        proxy_intercept_errors on;
        error_page 404 = @static_asset_404;
    }

    # ── Image Optimization Cache ──────────────────────────────────────────
    # /_next/image — Next.js Image Optimization API
    # NOTE: Exempt from connection limit (many images fetched in parallel).
    location /_next/image {
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # 1 day cache with 7 day stale-while-revalidate
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }

    # ── Public Uploaded Files (images, documents) ─────────────────────────
    # Uploaded files are served via the app's /uploads route.
    # Cache them aggressively since they are immutable (content-based naming).
    location /uploads/ {
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    }

    # ── SEO & Sitemap Routes — short cache for freshness ──────────────────
    location ~ ^/(robots\.txt|sitemap\.xml|sitemap-\d+\.xml|sitemap-index\.xml) {
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=600" always;
    }

    # ── Catch-All: Everything Else via App ────────────────────────────────
    location / {
        limit_req zone=general burst=50 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 20;

        # Sub-request to internal named location for common headers
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;

        # WebSocket support (Next.js HMR, Socket.io, etc.)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;

        # Disable proxy buffering for Server-Sent Events (SSE) and streaming
        proxy_buffering off;

        # Prevent caching for dynamic content
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;

        # Timeouts — generous for Next.js SSR and API routes
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 30s;
    }

    # ── Internal Fallback Location ────────────────────────────────────────
    location @app_fallback {
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location @static_asset_404 {
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404;
    }

    # ── Deny Access to Hidden Files ───────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Deny Access to Sensitive Files ────────────────────────────────────
    location ~* (\.env|\.env\.|composer\.json|composer\.lock|package\.json|package-lock\.json|yarn\.lock|Dockerfile|docker-compose\.yml|\.git) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }
}

