# Supplier egress proxy on the Contabo VPS (#411).
#
# Supplier APIs (Dinamik for certain, possibly Başbuğ) allow-list the VPS address 173.249.36.2.
# While the application runs on AWS it reaches them through this proxy:
#   SUPPLIER_EGRESS_PROXY=http://<user>:<password>@173.249.36.2:3128
#   SUPPLIER_EGRESS_PROXY_FOR=dinamik[,basbug]
# The application only sends HTTPS through CONNECT, so this proxy never sees API keys or data.
#
# Three gates, all required: the AWS egress address (allowed-clients.txt), a password
# (/etc/squid/passwords, not in Git) and a supplier host on port 443 (allowed-hosts.txt).
# Setup and checks: README.md.

http_port 3128

auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwords
auth_param basic realm getirbakim-egress
auth_param basic children 2
auth_param basic credentialsttl 1 hour

acl aws_egress src "/etc/squid/allowed-clients.txt"
acl supplier_hosts dstdomain "/etc/squid/allowed-hosts.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT
acl authenticated proxy_auth REQUIRED

# Order matters: unknown clients are refused before they are asked for a password.
http_access deny !aws_egress
http_access deny !CONNECT
http_access deny !SSL_ports
http_access deny !supplier_hosts
http_access allow authenticated
http_access deny all

# Pure tunnel: nothing is cached, nothing about the client is forwarded.
cache deny all
cache_mem 8 MB
forwarded_for delete
via off
visible_hostname getirbakim-egress
httpd_suppress_version_string on

# Squid runs as 'proxy', which cannot write /dev/stdout in this image; logs stay in the volume.
# The access log records time, client, CONNECT host:port, status and bytes (no request contents).
logformat egress %ts.%03tu %>a %un %rm %ru %>Hs %<st %tr
access_log daemon:/var/log/squid/access.log egress
cache_log /var/log/squid/cache.log
logfile_rotate 7
