# Squid forward proxy — Dinamik API egress.
#
# The Dinamik supplier API (dinamikapp-api.dinamik.online) whitelists the VPS
# egress IP. The app container routes its Dinamik requests through this proxy
# (DINAMIK_PROXY_URL=http://squid:3128); local development reaches it with an
# SSH tunnel to the loopback-only host binding (see docker-compose.yml):
#   ssh -L 18888:127.0.0.1:8888 root@<vps>
#   DINAMIK_PROXY_URL=http://127.0.0.1:18888
#
# Access is restricted to the Docker network and localhost — the proxy is
# never publicly reachable.

http_port 3128

# Docker bridge networks + localhost only
acl localnet src 172.16.0.0/12
acl localnet src 10.0.0.0/8
acl localnet src 192.168.0.0/16

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost
http_access allow localnet
http_access deny all

# Pure forward proxy — no caching
cache deny all
cache_mem 8 MB

# Squid drops privileges to the 'proxy' user, which cannot write /dev/stdout
# in this image — use the standard log files instead:
#   docker exec getirbakim-squid tail /var/log/squid/access.log
access_log daemon:/var/log/squid/access.log
cache_log /var/log/squid/cache.log

# Don't advertise internal hostnames
visible_hostname getirbakim-squid
forwarded_for delete
via off
