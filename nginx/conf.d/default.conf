upstream nextjs {
    server nextjs:3000;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name getirbakim.com www.getirbakim.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://getirbakim.com$request_uri;
    }
}

# Redirect www to apex on HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name www.getirbakim.com;

    ssl_certificate /etc/letsencrypt/live/getirbakim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getirbakim.com/privkey.pem;

    return 301 https://getirbakim.com$request_uri;
}

# HTTPS - primary server (apex only)
server {
    listen 443 ssl;
    http2 on;
    server_name getirbakim.com;

    ssl_certificate /etc/letsencrypt/live/getirbakim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getirbakim.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm font/woff2;

    # Static assets — immutable, cache forever
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Image optimization cache
    location /_next/image {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
