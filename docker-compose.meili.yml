# Meilisearch-only docker-compose for local development.
#
# Purpose: Run ONLY Meilisearch in Docker while the Next.js app
# runs locally via `bun run dev` / `npm run dev`. This saves battery
# and improves hot-reload speed on macOS/OrbStack.
#
# Usage:
#   bun run meili:start
#   bun run dev
#
# Or manually:
#   docker compose -f docker-compose.meili.yml up -d
#
# Meilisearch will be available at http://127.0.0.1:7700
# The Next.js app connects to MEILI_HOST=http://127.0.0.1:7700 (not Docker DNS).
#
# To stop:
#   bun run meili:stop
#   Or: docker compose -f docker-compose.meili.yml down
#
# This compose file uses project name "getirbakim-meili" so it does
# not interfere with docker-compose.local.yml or docker-compose.yml.
# The meilisearch data volume (meili_data_local) is shared across
# local compose files so search indexes persist between mode switches.

name: getirbakim-meili

services:
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: getirbakim-meilisearch-local
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-local-dev-master-key}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data_local:/meili_data
    ports:
      - "127.0.0.1:7700:7700"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  meili_data_local:
    external: true
    name: getirbakim-meili-data