name: Deploy VPS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd '${{ secrets.VPS_PROJECT_PATH }}' \
             && git pull origin main \
             && PROJECT_PATH='${{ secrets.VPS_PROJECT_PATH }}' DOMAIN='${{ secrets.VPS_DOMAIN }}' bash scripts/vps-deploy.sh"

      - name: Run smoke tests
        if: success()
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd '${{ secrets.VPS_PROJECT_PATH }}' \
             && DOMAIN='${{ secrets.VPS_DOMAIN }}' bash scripts/vps-smoke.sh"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key