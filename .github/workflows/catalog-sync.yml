name: Catalog Sync

# Populate/refresh the catalog schema from the raw supplier layer
# (v0.dnmk_products / v0.bsbg_products) by calling the internal catalog
# endpoints from INSIDE the VPS — nginx blocks /api/internal/* publicly, so the
# work runs on the app container over the Docker network via scripts/catalog-sync.sh.
#
# Idempotent. Manual only.

on:
  workflow_dispatch:
    inputs:
      enrich:
        description: 'Also run enrich-from-parts (names/images/props/fitment) after sync'
        type: boolean
        default: true
      timeout_seconds:
        description: 'Per-request curl timeout in seconds (~1.1M raw rows can take a while)'
        default: '1800'

# Never let two catalog syncs overlap.
concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  catalog-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # Run the remote logic from a committed script (same pattern as vps-deploy.sh)
      # — no fragile heredoc-over-SSH. Refresh just that one file from origin/main
      # first so a dispatch works even before the next full deploy syncs it.
      - name: Run catalog sync on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=60 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd '${{ secrets.VPS_PROJECT_PATH }}' \
             && git fetch origin -q \
             && git checkout origin/main -- scripts/catalog-sync.sh \
             && PROJECT_PATH='${{ secrets.VPS_PROJECT_PATH }}' ENRICH='${{ inputs.enrich }}' TIMEOUT='${{ inputs.timeout_seconds }}' bash scripts/catalog-sync.sh"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
