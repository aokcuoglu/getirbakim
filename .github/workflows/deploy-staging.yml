name: Deploy new system staging
# Staging is paused until the AWS migration and an explicit user request.
# Re-enabling this workflow does not restore the former Contabo deployment.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paused:
    runs-on: ubuntu-24.04
    steps:
      - name: Staging is paused
        run: echo "Staging is paused. See docs/development-workflow.md before designing an AWS workflow."
