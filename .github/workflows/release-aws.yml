name: Release to AWS
# Manual only, from main, by the repository owner, with the version being released:
#   gh workflow run release-aws.yml --ref main -f version=X.Y.Z
# The guard job stops anything else (another branch, another actor or re-runner, a version different from
# package.json) before CI and before any AWS call; it replaces the former `production` environment approval,
# which a private repository on the GitHub Free plan does not have. The release role in AWS must trust this
# repository's main branch instead of the environment (getirbakim-infra#5) before this file lands.
#
# Same steps as an operator with the infrastructure repository:
#   push-image.sh  build the app and operations images (linux/arm64), push them to ECR under the
#                  commit SHA, upload /_next/static
#   release.sh     RDS snapshot, operations task definitions, scripts/setup.ts + ANALYZE, app
#                  rolling update, released tags in SSM, smoke tests
#
# Repository-level configuration (Settings > Secrets and variables > Actions):
#   variables  AWS_RELEASE_ROLE_ARN  Cicd stack output DeployRoleArn
#              INFRA_REPOSITORY      owner/name of the infrastructure repository
#              every key of the infrastructure repository's .env.example (its configuration;
#              there is no .env in CI), e.g. from the infrastructure checkout:
#                gh variable set -R aokcuoglu/getirbakim -f .env
#                gh variable set -R aokcuoglu/getirbakim AWS_RELEASE_ROLE_ARN --body <DeployRoleArn>
#                gh variable set -R aokcuoglu/getirbakim INFRA_REPOSITORY --body <owner/name>
#   secrets    INFRA_DEPLOY_KEY      private half of a read-only deploy key of that repository:
#                gh secret set -R aokcuoglu/getirbakim INFRA_DEPLOY_KEY < <deploy key file>
# Every repository variable is exported to the infrastructure scripts except AWS_RELEASE_ROLE_ARN,
# INFRA_REPOSITORY and CI_RUNS_ON (the CI runner choice, ci.yml); keep other variables out of the repository.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version being released; must equal package.json on the dispatched commit (e.g. 0.31.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: aws-production-release
  cancel-in-progress: false
jobs:
  guard:
    # A failing job rather than a job-level `if`: a skipped release would look like a quiet success.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - name: Check branch, actor and version
        env:
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
        run: |
          failed=0
          if [ "$REF" != "refs/heads/main" ]; then echo "::error::Releases run only from main, not $REF"; failed=1; fi
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ]; then
            echo "::error::Only $OWNER may release (actor $ACTOR, triggered by $TRIGGERING_ACTOR)"; failed=1
          fi
          expected="$(jq -r .version package.json)"
          if [ "$VERSION" != "$expected" ]; then
            echo "::error::Input version '$VERSION' does not match package.json $expected"; failed=1
          fi
          exit "$failed"
  check:
    needs: guard
    uses: ./.github/workflows/ci.yml
  release:
    needs: [guard, check]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: app
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.INFRA_REPOSITORY }}
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
          ref: main
          path: infra
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
        working-directory: infra
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          role-session-name: release-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: eu-central-1
      - name: Load the infrastructure configuration
        # The repository variables, exported for the scripts and the CDK app (they read them
        # when CI=true and there is no .env). Values are single-line; anything else is refused.
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          test ! -e infra/.env
          jq -r 'to_entries[]
            | select(.key != "AWS_RELEASE_ROLE_ARN" and .key != "INFRA_REPOSITORY" and .key != "CI_RUNS_ON")
            | if (.value | test("[\\r\\n]")) then error("multi-line value: \(.key)") else "\(.key)=\(.value)" end' \
            <<<"$VARS_JSON" >> "$GITHUB_ENV"
      - name: Store the credentials under the configured profile
        # The scripts drop the AWS credential variables and pass --profile explicitly.
        run: |
          profile="$PRODUCTION_AWS_PROFILE"
          test -n "$profile"
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile "$profile"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile "$profile"
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile "$profile"
          aws configure set region eu-central-1 --profile "$profile"
      - name: Build and push images
        working-directory: infra
        run: ./scripts/push-image.sh production ../app
      - name: Release
        working-directory: infra
        run: ./scripts/release.sh production "$(git -C ../app rev-parse --short=12 HEAD)" --yes
      - name: Remove credentials
        if: always()
        run: rm -rf ~/.aws
