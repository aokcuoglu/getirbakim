name: New system CI
on:
  pull_request:
    branches: [main, dev]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pricing_test
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run harness:lint && npm run harness:test
      - run: node --conditions=react-server --import tsx --test scripts/test-product-pricing.ts scripts/test-supplier-checkout.ts scripts/test-enrichment-import.ts scripts/test-storefront-bundle-items.ts scripts/test-storefront-split.ts scripts/test-storefront-sync.ts
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/pricing_test
      - run: npm run test:review && npm run test:partner && npm run test:basbug && npm run test:dinamik && node --import tsx --test scripts/test-supplier-changes.ts scripts/test-product-match-schedule.ts scripts/test-supplier-run-error.ts scripts/test-supplier-health-status.tsx scripts/test-admin-format.tsx && npm run test:seta && npm run test:supplier-items && npm run test:supplier-data-status && npm run test:egress-proxy && npm run test:pick-key && npm run test:matching-same && npm run test:manual && npm run test:spareto && npm run test:parts2world && npm run test:cache-handler && node --import tsx --test scripts/test-product-enrichment.ts && npm run test:part-art && npm run test:data-table && npm run test:brand && npm run test:fitment && npm run test:fitment-level && npm run test:description-fitment && node --import tsx --test scripts/test-enrichment-pace.ts && npm run test:logos && node --import tsx --test scripts/test-enrichment-worker.ts && node --conditions=react-server --import tsx --test scripts/test-enrichment-search-products.ts && npm run test:otoparcasan && npm run test:vehicle-oil && npm run test:maintenance-kit && npm run test:vehicle-families && npm run test:vehicle-repxpert && npm run test:app-version && npm run test:seo && npm run test:site-metadata && npm run test:structured-data && npm run test:listing-paths && npm run test:session-cookie && npm run test:product-paths && npm run test:analytics && npm run test:product-meta && npm run test:product-tabs && npm run test:vehicle-model-groups && npm run test:vehicle-label && npm run test:checkout-refresh && npm run test:remote-image && npm run test:related-suggestions
      - run: npm run test:catalog-filters && npm run test:unavailable && npm run test:garage && npm run test:maintenance-kit-query && npm run test:vehicle-model-listing && npm run test:sitemap && npm run test:indexnow && npm run test:product-overrides && npm run test:product-equivalents && npm run test:product-override-images && npm run test:product-override-references && npm run test:product-override-specs && npm run test:product-override-fitments && npm run test:restock && npm run test:payments && npm run test:payment-refunds && npm run test:order-actions && npm run test:order-cancel && npm run test:order-agreement && node --import tsx --test --test-name-pattern='catalog CLI|master product' scripts/test-enrichment-worker.ts && node --import tsx --test scripts/test-storefront-make-fits.ts && node --conditions=react-server --import tsx --test scripts/test-enrichment-search-products.ts && npm run test:related-suggestions-query
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/pricing_test
      - run: npm run test:media-gc
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/pricing_test
      - run: npm run build
        env:
          APP_ENV: staging
          SITE_URL: http://localhost:3103
