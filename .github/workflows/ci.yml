name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # `prisma generate` (postinstall) and prisma.config.ts require these to be
    # set to resolve `env('DATABASE_URL')`. Generate/typecheck/tests never open a
    # connection, so a dummy URL is sufficient — no live database is needed.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile # postinstall runs `prisma generate`

      - name: Unsafe raw SQL check (blocking)
        run: bun run check:unsafe-sql

      # Advisory only: `next build` runs with `typescript.ignoreBuildErrors: true`
      # and the repo currently has many pre-existing tsc errors (stale admin code
      # vs. schema). Surfaced here as an annotation but NOT blocking until those
      # are cleaned up. Flip `continue-on-error` to false once tsc is green.
      - name: Typecheck (advisory)
        run: bun run typecheck
        continue-on-error: true

      - name: Test (blocking)
        run: bun test
