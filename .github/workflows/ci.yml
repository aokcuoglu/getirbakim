name: New system CI
on:
  pull_request:
    branches: [main, dev]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:review && npm run test:dinamik && npm run test:part-art && npm run test:brand && npm run test:fitment && npm run test:fitment-level && node --import tsx --test scripts/test-enrichment-pace.ts && npm run test:logos && node --import tsx --test scripts/test-enrichment-worker.ts
      - run: npm run build
        env:
          APP_ENV: staging
          SITE_URL: http://localhost:3103
