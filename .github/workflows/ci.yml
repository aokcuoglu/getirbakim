name: New system CI
on:
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: next-system-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:review && npm run test:brand && npm run test:fitment && npm run test:logos && node --import tsx --test scripts/test-enrichment-worker.ts
      - run: npm run build
        env:
          APP_ENV: staging
          SITE_URL: http://localhost:3103
