name: Deploy to VPS

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_MEILI_HOST=${{ vars.NEXT_PUBLIC_MEILI_HOST }}
            NEXT_PUBLIC_MEILI_SEARCH_KEY=${{ vars.NEXT_PUBLIC_MEILI_SEARCH_KEY }}
            NEXT_PUBLIC_ENABLE_COOKIEYES=${{ vars.NEXT_PUBLIC_ENABLE_COOKIEYES }}
            NEXT_PUBLIC_COOKIEYES_CLIENT_ID=${{ vars.NEXT_PUBLIC_COOKIEYES_CLIENT_ID }}
            NEXT_PUBLIC_COOKIEYES_ALLOWED_HOSTS=${{ vars.NEXT_PUBLIC_COOKIEYES_ALLOWED_HOSTS }}
            NEXT_PUBLIC_BUILD_VERSION=${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/getirbakim
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull nextjs
            docker compose up -d nextjs
            docker image prune -f
