name: VPS Log Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Check app logs
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd '${{ secrets.VPS_PROJECT_PATH }}' \
             && echo '=== ERRORS ===' \
             && docker logs getirbakim-app --tail=300 2>&1 | grep -iE 'error|fail|exception|ENOTFOUND|timeout' | tail -30 \
             && echo '' \
             && echo '=== RECENT REQUESTS ===' \
             && docker logs getirbakim-app --tail=300 2>&1 | grep -iE 'GET|POST|200|500|304|404' | tail -10 \
             && echo '' \
             && echo '=== CONTAINERS ===' \
             && docker ps --format 'table {{.Names}}\t{{.Status}}'"

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
