# Production docker-compose — Contabo VPS deployment.
#
# Architecture:
#   Cloudflare → edge-nginx (:80/:443, TLS — the standalone neutral `edge` unit,
#   shared with the co-hosted bakimx project) → this app (:3000) via the external
#   `edge` network. Meilisearch / PostgreSQL / Squid stay private on app-network.
#
#   This stack runs NO nginx of its own. The edge lives in the `edge/` unit and is
#   owned by neither product; this app just attaches to the `edge` network with
#   the alias `getirbakim-app`. See edge/README.md for the edge + migration.
#
# Properties:
#   - App / Meilisearch / PostgreSQL / Squid have NO public port binding
#   - App is reachable publicly only through edge-nginx over the `edge` network
#   - All services have healthchecks; resource limits prevent OOM kills
#   - TLS certs: host certbot; deploy-hook reloads edge-nginx (see edge/README.md)
#
# Build strategy: local build from Dockerfile on VPS.
# The deploy script (scripts/vps-deploy.sh) injects NEXT_PUBLIC_BUILD_VERSION
# at build time so /api/health reports the correct release version.
# .env.production should NOT contain NEXT_PUBLIC_BUILD_VERSION.
#
# Usage:
#   NEXT_PUBLIC_BUILD_VERSION=v0.2.3 docker compose --env-file .env.production up -d --build
#
# See docs/DEPLOYMENT_CONTABO.md for full instructions.

services:
  # NOTE: This stack has NO nginx. The public entry point (:80/:443, TLS) is the
  # standalone neutral `edge` unit shared with the co-hosted bakimx project (see
  # the `edge/` repo/dir on the VPS). This app joins the external `edge` network
  # with the alias `getirbakim-app`, which the edge nginx proxies to on :3000.

  # ── Next.js Application ────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_MEILI_HOST: ${NEXT_PUBLIC_MEILI_HOST:-}
        NEXT_PUBLIC_MEILI_SEARCH_KEY: ${NEXT_PUBLIC_MEILI_SEARCH_KEY:-}
        NEXT_PUBLIC_ENABLE_COOKIEYES: ${NEXT_PUBLIC_ENABLE_COOKIEYES:-false}
        NEXT_PUBLIC_COOKIEYES_CLIENT_ID: ${NEXT_PUBLIC_COOKIEYES_CLIENT_ID:-}
        NEXT_PUBLIC_COOKIEYES_ALLOWED_HOSTS: ${NEXT_PUBLIC_COOKIEYES_ALLOWED_HOSTS:-}
        NEXT_PUBLIC_BUILD_VERSION: ${NEXT_PUBLIC_BUILD_VERSION:-dev}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-getirbakim}
    container_name: getirbakim-app
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BUILD_VERSION: ${NEXT_PUBLIC_BUILD_VERSION:-dev}
      MEILI_ENABLED: ${MEILI_ENABLED:-false}
      MEILI_HOST: ${MEILI_HOST:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
      MEILI_INDEX_PRODUCTS: ${MEILI_INDEX_PRODUCTS:-products}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-getirbakim}
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-getirbakim}
      DATABASE_POOL_MAX: "10"
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_URL: ${AUTH_URL:-https://getirbakim.com}
    depends_on:
      meilisearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      # Private stack network (db / meili / squid).
      app-network:
      # Shared neutral edge network — the edge nginx proxies to this alias.
      edge:
        aliases:
          - getirbakim-app
    volumes:
      - ./data/storage:/app/data/storage:delegated
    # NO port binding — reached only via the private stack network (internal
    # services) and the edge network (public traffic through edge-nginx:3000).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ── Meilisearch (self-hosted, internal network only) ───────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: getirbakim-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    networks:
      - app-network
    # NO port binding — internal Docker network only.
    # App communicates via http://meilisearch:7700
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          # Indexing the ~1M-doc catalog peaks well above 512M; the container
          # was OOM-killed (exit 137) mid-backfill. VPS has 7.8G / no swap, so
          # 3G leaves headroom alongside app (1G) + postgres.
          memory: 3G
        reservations:
          memory: 512M

  # ── Squid Forward Proxy (Dinamik API egress — IP whitelist) ────────────
  # The Dinamik supplier API whitelists the VPS IP. The app reaches it via
  # DINAMIK_PROXY_URL=http://squid:3128 (.env.production). Host binding is
  # loopback-only so local dev can tunnel in (ssh -L 18888:127.0.0.1:8888)
  # without ever exposing the proxy publicly.
  squid:
    image: ubuntu/squid:latest
    container_name: getirbakim-squid
    restart: unless-stopped
    volumes:
      - ./infra/squid/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - app-network
    ports:
      - "127.0.0.1:8888:3128"
    healthcheck:
      test: ["CMD-SHELL", "squid -k check"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  # ── PostgreSQL (self-hosted, internal network only) ─────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: getirbakim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-getirbakim}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    # Bind ONLY to host loopback — not reachable from the internet, only via an
    # SSH tunnel to the VPS. Lets DBeaver/psql on remote PCs reach a stable
    # 127.0.0.1:5432 endpoint (no need to chase the changing container IP).
    # App still talks to postgres via postgres:5432 on the Docker network.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-getirbakim}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M

networks:
  app-network:
    driver: bridge
  # Shared neutral edge network, owned by the standalone `edge` unit (not by this
  # project). Created out of band: `docker network create edge`. External so a
  # `docker compose down` here never destroys it or affects the co-hosted app.
  edge:
    external: true
    name: edge

volumes:
  meili_data:
  postgres_data:
