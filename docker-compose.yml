# Production docker-compose — Contabo VPS deployment.
#
# Architecture (Phase 2 Hardened):
#   Cloudflare → Nginx (Docker, :80/:443 only) → App (:3000 internal) + Meilisearch (:7700 internal)
#
# Key changes from legacy setup:
#   - Nginx is now INSIDE Docker Compose (was host-level service)
#   - App has NO port binding → internal Docker network only
#   - Meilisearch has NO port binding → internal Docker network only
#   - All services have healthchecks
#   - Resource limits prevent OOM kills
#   - Rate limiting handled by nginx (infra/nginx/nginx.production.conf)
#
# Migration from host-nginx to docker-nginx:
#   1. systemctl stop nginx   (or equivalent — frees ports 80/443)
#   2. systemctl disable nginx
#   3. Deploy with this compose file
#   4. Docker nginx takes over 80/443 automatically
#   5. Certbot renewal stays on host → post-hook reloads docker nginx
#
# Build strategy: local build from Dockerfile on VPS.
# The deploy script (scripts/vps-deploy.sh) injects NEXT_PUBLIC_BUILD_VERSION
# at build time so /api/health reports the correct release version.
# .env.production should NOT contain NEXT_PUBLIC_BUILD_VERSION.
#
# Usage:
#   NEXT_PUBLIC_BUILD_VERSION=v0.2.3 docker compose --env-file .env.production up -d --build
#
# See docs/DEPLOYMENT_CONTABO.md for full instructions.

services:
  # ── Nginx Reverse Proxy (sole public entry point) ──────────────────────
  nginx:
    image: nginx:stable-alpine
    container_name: getirbakim-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Production nginx config (managed in repo)
      - ./infra/nginx/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt certificates (managed by host certbot)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Certbot ACME challenge webroot
      - /var/www/certbot:/var/www/certbot:ro
      # Nginx logs — NOT mounted as volume; image's built-in symlinks
      # (/dev/stdout, /dev/stderr) ensure logs appear in docker logs.
      # Use `docker logs getirbakim-nginx` for debugging.
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # ── Next.js Application ────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_MEILI_HOST: ${NEXT_PUBLIC_MEILI_HOST:-}
        NEXT_PUBLIC_MEILI_SEARCH_KEY: ${NEXT_PUBLIC_MEILI_SEARCH_KEY:-}
        NEXT_PUBLIC_ENABLE_COOKIEYES: ${NEXT_PUBLIC_ENABLE_COOKIEYES:-false}
        NEXT_PUBLIC_COOKIEYES_CLIENT_ID: ${NEXT_PUBLIC_COOKIEYES_CLIENT_ID:-}
        NEXT_PUBLIC_COOKIEYES_ALLOWED_HOSTS: ${NEXT_PUBLIC_COOKIEYES_ALLOWED_HOSTS:-}
        NEXT_PUBLIC_BUILD_VERSION: ${NEXT_PUBLIC_BUILD_VERSION:-dev}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-getirbakim}
    container_name: getirbakim-app
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BUILD_VERSION: ${NEXT_PUBLIC_BUILD_VERSION:-dev}
      MEILI_ENABLED: ${MEILI_ENABLED:-false}
      MEILI_HOST: ${MEILI_HOST:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
      MEILI_INDEX_PRODUCTS: ${MEILI_INDEX_PRODUCTS:-products}
    depends_on:
      meilisearch:
        condition: service_healthy
    networks:
      - app-network
    # NO port binding — internal Docker network only.
    # Nginx proxies to app:3000 via the app-network bridge.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ── Meilisearch (self-hosted, internal network only) ───────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: getirbakim-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    networks:
      - app-network
    # NO port binding — internal Docker network only.
    # App communicates via http://meilisearch:7700
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

networks:
  app-network:
    driver: bridge

volumes:
  meili_data:
