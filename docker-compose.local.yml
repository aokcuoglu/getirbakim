# Local build docker-compose — builds from local Dockerfile.
# Usage: docker compose -f docker-compose.local.yml up -d --build
#
# This is for local Docker testing. The production docker-compose.yml
# builds from the local Dockerfile on VPS and requires .env.production.
#
# For local development without Docker, use: bun run dev
# See docs/DOCKER_LOCAL.md for detailed instructions.
#
# Meilisearch is included as a local service. Port 7700 is bound to
# 127.0.0.1 only — never exposed to the public network.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_MEILI_HOST: ${NEXT_PUBLIC_MEILI_HOST:-http://localhost:7700}
        NEXT_PUBLIC_MEILI_SEARCH_KEY: ${NEXT_PUBLIC_MEILI_SEARCH_KEY:-}
        NEXT_PUBLIC_ENABLE_COOKIEYES: ${NEXT_PUBLIC_ENABLE_COOKIEYES:-false}
        NEXT_PUBLIC_COOKIEYES_CLIENT_ID: ${NEXT_PUBLIC_COOKIEYES_CLIENT_ID:-}
        NEXT_PUBLIC_COOKIEYES_ALLOWED_HOSTS: ${NEXT_PUBLIC_COOKIEYES_ALLOWED_HOSTS:-}
        NEXT_PUBLIC_BUILD_VERSION: ${NEXT_PUBLIC_BUILD_VERSION:-dev-local}
    container_name: getirbakim-app-local
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BUILD_VERSION: ${NEXT_PUBLIC_BUILD_VERSION:-dev-local}
      MEILI_ENABLED: "true"
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: local-dev-master-key
      MEILI_INDEX_PRODUCTS: products
    depends_on:
      meilisearch:
        condition: service_started
    networks:
      - app-network
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: getirbakim-meilisearch-local
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: local-dev-master-key
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data_local:/meili_data
    networks:
      - app-network
    ports:
      - "127.0.0.1:7700:7700"

networks:
  app-network:
    driver: bridge

volumes:
  meili_data_local: