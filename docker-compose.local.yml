# Local infrastructure only — Postgres + Meilisearch.
#
# The app itself runs OUTSIDE Docker via `bun run dev` on port 3001
# (see package.json "dev"). This mirrors the bakimx local setup: only the
# backing services live in Docker, the Next.js app runs natively for fast HMR.
#
# Usage:
#   bun run dev:deps   # start postgres + meilisearch in Docker
#   bun run dev        # start Next.js on http://localhost:3001
#
# .env.local already points DATABASE_URL/MEILI_HOST at the host-mapped ports
# below (127.0.0.1:54322 for postgres, 127.0.0.1:7700 for meilisearch).

services:
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: getirbakim-meilisearch-local
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: local-dev-master-key
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data_local:/meili_data
    ports:
      - "127.0.0.1:7700:7700"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  postgres:
    image: postgres:17-alpine
    container_name: getirbakim-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-getirbakim}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-local-dev-postgres-password}
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54322:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${LOCAL_POSTGRES_USER:-postgres} -d ${LOCAL_POSTGRES_DB:-getirbakim}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M

volumes:
  meili_data_local:
    external: true
    name: getirbakim-meili-data
  postgres_data_local:
    external: true
    name: getirbakim-postgres-data
